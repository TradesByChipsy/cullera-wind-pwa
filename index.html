<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06243a">
<title>Cullera Wind &amp; Welle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-900:#06243a; --sea-700:#11507c; --sea-500:#1f7fb0;
    --gold:#f2a900; --coral:#ff6b4a; --coral-deep:#e34a2b;
    --ink:#06243a; --mute:#5b7689;
    --line:rgba(6,36,58,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Hanken Grotesk',sans-serif;color:var(--ink);
    background:
      radial-gradient(120% 80% at 80% -10%, #2a9fd0 0%, transparent 55%),
      radial-gradient(100% 70% at -10% 0%, #0b3a5c 0%, transparent 50%),
      linear-gradient(180deg,#06243a 0%, #0b3a5c 30%, #0e4a72 100%);
    background-attachment:fixed;
    min-height:100vh;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto}

  header{color:#e8f3f1;margin-bottom:16px}
  .eyebrow{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:#9fd3e8;display:flex;gap:10px;align-items:center}
  .eyebrow::before{content:"";width:22px;height:1px;background:#9fd3e8;display:inline-block}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,8vw,42px);line-height:.98;letter-spacing:-.02em;margin:6px 0 4px}
  h1 em{font-style:italic;color:var(--gold);font-weight:600}
  .controls{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  button.refresh{
    font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    background:var(--coral);color:#fff;border:none;padding:9px 16px;border-radius:999px;
    box-shadow:0 8px 20px -8px var(--coral-deep)
  }
  button.refresh:active{transform:translateY(1px)}
  .updated{font-family:'DM Mono',monospace;font-size:11px;color:#bcd9e6}

  /* Live-Messwerte: optisch abgesetzt von den Prognosekarten, damit auf einen
     Blick klar ist, was gemessen und was gerechnet ist */
  .live{
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
    border-radius:14px;padding:12px 14px;margin-bottom:12px;color:#e8f3f1
  }
  .live .lab{
    font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:#9fd3e8;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px
  }
  .live .lab .src{letter-spacing:.04em;text-transform:none;color:#7fa8bd;font-size:9px}
  .live-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0}
  .live-row .st{font-size:13px}
  .live-row .kn{font-family:'DM Mono',monospace;font-size:17px;font-weight:500}
  .live-row .kn small{font-size:11px;color:#bcd9e6;font-weight:400}
  .live-row .meta{font-family:'DM Mono',monospace;font-size:10.5px;color:#bcd9e6}
  .live-row.alt{opacity:.5}
  .live-row.alt .meta::after{content:" · veraltet"}
  .live .q-auf{color:#7ee3b4;font-weight:600}
  .live .q-ab{color:#ff9d85;font-weight:600}
  .live .q-seit{color:#bcd9e6}

  .cards{display:flex;flex-direction:column;gap:12px}
  .card{
    background:linear-gradient(180deg,#fbf4e6 0%,#f6ecd8 100%);
    border-radius:18px;padding:16px;
    box-shadow:0 16px 36px -20px rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.4)
  }
  .card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .day{font-family:'Fraunces',serif;font-size:21px;font-weight:600}
  .date{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--mute)}

  .big{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:12px}
  .stat{background:rgba(6,36,58,.05);border-radius:12px;padding:11px 12px;border:1px solid rgba(6,36,58,.06)}
  .stat .lab{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
  .stat .val{font-family:'DM Mono',monospace;font-size:30px;font-weight:500;line-height:1.05;margin-top:5px}
  .stat .val small{font-size:13px;color:var(--mute);font-weight:400}
  .stat .sub{font-size:12px;color:var(--mute);margin-top:3px}
  .stat .sub b{color:var(--ink);font-weight:600}
  .stat .val small.at{font-size:12px;color:var(--mute);font-weight:400;letter-spacing:0}
  .stat .sub.bias{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--coral-deep);margin-top:4px;line-height:1.45}
  /* Wahrscheinlichkeit aus dem Ensemble – als Balken, weil "68 %" als Zahl
     allein nicht schneller lesbar ist als die Windspitze darüber. */
  .chance{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
  .chance-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mute)}
  .chance-head b{font-family:'DM Mono',monospace;font-size:15px;color:var(--ink);font-weight:600}
  .chance-bar{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
  .chance-bar i{display:block;height:100%;border-radius:3px;background:var(--gold)}
  .chance-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--mute);margin-top:4px;line-height:1.5}
  .srow-aemet{margin-top:5px;padding-top:7px;border-top:1px solid var(--line)}
  .zweit-tag{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--mute);
    border:1px solid var(--line);border-radius:3px;padding:1px 4px;white-space:nowrap}
  .nowcast{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .nowcast .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:8px}
  .nowcast .src{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0;text-transform:none}
  /* Die Stundentabelle ist für die hellen Tageskarten gebaut. Auf dem dunklen
     Nowcast-Panel muss jede Farbregel einzeln überschrieben werden – die
     Kartenregeln sind spezifischer als ein bloßes color am Tabellenelement. */
  .nowcast .strip{background:transparent;margin:0}
  .nowcast table.hours th,.nowcast table.hours td{color:#dcecf4}
  .nowcast table.hours tr:first-child th{color:#9fd3e8;border-bottom-color:rgba(255,255,255,.16)}
  .nowcast table.hours td b{color:#fff;font-weight:600}
  .nowcast table.hours th.rowlab{
    background:#0d3f63;color:#9fd3e8;
    box-shadow:2px 0 5px -2px rgba(0,0,0,.45)
  }
  .nowcast table.hours .hl{background:rgba(242,169,0,.26)}
  .nowcast table.hours tr:first-child th.hl{color:var(--gold);font-weight:600}
  /* Auflandig/ablandig in den hellen Tönen des Messpanels, nicht in den
     Kartenfarben – die sind für weißen Grund gemischt. */
  .nowcast .q-auf{color:#7ee3b4;font-weight:600}
  .nowcast .q-ab{color:#ff9d85;font-weight:600}
  .nowcast .q-seit{color:#bcd9e6}
  .stat .sub.spread{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--mute);margin-top:4px}
  .stat .sub.spread-warn{color:var(--coral-deep);font-weight:500}
  .dir-arrow{display:inline-block;font-size:14px;line-height:1}

  .srow-lead{font-weight:600;color:var(--ink)}
  .srow .res{font-family:'DM Mono',monospace;font-size:10px;color:var(--mute);font-weight:400}
  .lead-tag{
    font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--gold);color:#3d2a00;border-radius:4px;padding:1.5px 5px;margin-left:3px;font-weight:500
  }

  .sources{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
  .sources .lab{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .srow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:#3a5567;padding:1.5px 0}
  .srow .sv{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--ink)}

  .strip-wrap{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
  .strip-wrap .lab{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
  .hl-hint{color:var(--gold);letter-spacing:.05em;text-transform:none}
  .strip{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;scrollbar-width:thin}
  table.hours{border-collapse:collapse;font-size:12px}
  table.hours th,table.hours td{
    font-family:'DM Mono',monospace;text-align:center;padding:3.5px 0;
    min-width:36px;color:#3a5567;font-weight:400;white-space:nowrap
  }
  table.hours tr:first-child th{font-size:10px;color:var(--mute);border-bottom:1px solid rgba(6,36,58,.1)}
  table.hours td b{font-weight:600;color:var(--ink)}
  table.hours th.rowlab{
    position:sticky;left:0;z-index:1;background:#f9f0dd;
    font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
    text-align:left;padding:3.5px 8px 3.5px 4px;min-width:46px;
    box-shadow:2px 0 4px -2px rgba(6,36,58,.15)
  }
  table.hours .hl{background:rgba(242,169,0,.16)}
  table.hours tr:first-child th.hl{color:#b07c00;font-weight:600}

  .q-auf{color:#177a52;font-weight:600}
  .q-ab{color:#c23a26;font-weight:600}
  .q-seit{color:var(--mute)}

  .state{color:#e8f3f1;text-align:center;padding:50px 20px;font-size:15px;line-height:1.5}
  .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{margin-top:22px;color:#8fbdd2;font-size:11px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Cullera · Valencia</div>
    <h1>Wind &amp; <em>Welle</em></h1>
    <div class="controls">
      <button class="refresh" id="refresh">&#8635; Aktualisieren</button>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <div id="content">
    <div class="state"><div class="spinner"></div>Lade Vorhersage&hellip;</div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
// Prognosepunkt = die AVAMET-Station el Marenyet (39°08'31" N, 00°14'20" W).
// Bewusst genau dorthin gelegt, wo gemessen wird: Die Bias-Korrektur eicht den
// Modellwert gegen diese Station, und das ist nur sinnvoll, wenn beide denselben
// Ort meinen. AROME HD rastet damit auf 39,14/-0,24 ein – 0,2 km von der Station
// entfernt statt 1,0 km beim früheren Punkt 39,169/-0,229.
// Die Wellenmodelle liefern hier unverändert; EWAM rastet weiterhin auf
// 39,15/-0,20 ein, jetzt 3,5 km statt 3,3 km entfernt.
const LAT = 39.142, LON = -0.239, TZ = "Europe/Madrid";
const FORECAST_DAYS = 5;
// Fensterende 20 Uhr statt 21: Sonnenuntergang ist im August gegen 20:55, die
// 21-Uhr-Stunde ist also ohnehin dunkel. Entscheidend ist aber der Nebeneffekt –
// AROME reicht am dritten Tag exakt bis 20 Uhr. Mit Fensterende 21 fiel es dort
// als "unvollständig" raus und der Tag wurde von ICON-EU (7 km) geführt;
// mit 20 Uhr führt es auch an Tag 3 mit 1,5 km.
const STRIP_START = 8, STRIP_END = 20;   // sichtbare Stundenleiste
const SESSION_WEEKDAY = [15, 20];        // relevantes Fenster Mo–Fr (nach Feierabend)
const SESSION_WEEKEND = [8, 20];         // Sa/So: ganzer Tag
const STALE_MS = 30 * 60 * 1000;         // Auto-Refresh, wenn Daten älter sind

function sessionWindow(dateStr){
  const wd = new Date(dateStr+"T12:00:00").getDay(); // 0=So, 6=Sa
  return (wd === 0 || wd === 6) ? SESSION_WEEKEND : SESSION_WEEKDAY;
}

// Leitmodell-Prinzip: Für die Küste bei Cullera zählt die feinste Auflösung,
// nicht der Durchschnitt. Die Seebrise ist kleinräumig – grobe Globalmodelle
// verschmieren Land und Meer in einer Gitterzelle und dämpfen sie weg.
// Reihenfolge = Priorität. Das erste Modell mit Daten für den Tag führt,
// der Rest dient nur als Streuungs-/Vertrauensangabe.
// AROME reicht ~69 h, danach übernehmen die gröberen Modelle automatisch.
//
// Ab Platz 3 entscheidet nicht mehr die Auflösung allein: ECMWF IFS ist mit 9 km
// gröber als ICON-EU mit 7 km, steht aber davor, weil es ab Tag 2 durchweg besser
// verifiziert und sein Gitterpunkt mit 3,0 km praktisch gleich nah liegt
// (ICON-EU: 2,6 km). Sobald die Messreihe genug Tag-3-Paare hat, lässt sich das
// nachprüfen statt annehmen.
//
// Bewusst NICHT dabei: ECMWF IFS 0.25° und AIFS 0.25° – beide rasten auf
// 39,0/-0,25 ein, also 18,4 km südlich. Das gilt NICHT mehr für ecmwf_ifs:
// seit ECMWF am 1.10.2025 den vollen Katalog geöffnet hat, gibt es HRES nativ
// in 9 km, und damit rückt der Gitterpunkt auf 3,0 km heran.
const WIND_MODELS = [
  {id:"meteofrance_arome_france_hd",    name:"AROME HD",      res:"1,5 km"},
  {id:"meteofrance_arome_france",       name:"AROME",         res:"2,5 km"},
  {id:"ecmwf_ifs",                      name:"ECMWF IFS",     res:"9 km"},
  {id:"icon_eu",                        name:"ICON-EU · DWD", res:"7 km"},
  {id:"ukmo_global_deterministic_10km", name:"UK Met Office", res:"10 km"},
  {id:"meteofrance_arpege_europe",      name:"ARPEGE",        res:"11 km"},
  {id:"gfs_seamless",                   name:"GFS · NOAA",    res:"13 km"},
];
// EWAM trifft mit 39,15/-0,20 den Küstenpunkt am genauesten.
// Nicht dabei: GFS-Wave – rastet auf 39,25/0,0 ein, ~20 km draußen auf See.
const WAVE_MODELS = [
  {id:"ewam",             name:"EWAM",      res:"5 km"},
  {id:"meteofrance_wave", name:"MFWAM",     res:"10 km"},
  {id:"ecmwf_wam025",     name:"ECMWF WAM", res:"25 km"},
  {id:"gwam",             name:"GWAM",      res:"25 km"},
];

// Bias-Korrektur aus der eigenen Messreihe.
// Auswertung vom 10.09.2026 über 460 Messpaare seit dem 16.08.: AROME HD liegt
// im Nachmittagsfenster nicht zu niedrig, sondern systematisch ZU HOCH – am Faro
// um 3,4 kn, an San Antonio um 5,1 kn. Der Fehler ist tageszeitabhängig: morgens
// nahe null, ab 14 Uhr kippend, abends bis −5 kn. Das ist mehr, als ein
// Modellwechsel je ausmacht, also wird es korrigiert statt ignoriert.
// Die Korrektur wird bei jedem Laden neu aus der CSV gerechnet und wird damit
// von allein besser, je länger der Job läuft.
const BIAS_MODEL_ID   = "meteofrance_arome_france_hd"; // nur dieses Modell wurde vermessen
const BIAS_MIN_HOUR   = 8;   // weniger Paare in einer Stunde = zu zufällig
const BIAS_MIN_TOTAL  = 30;  // Mindestumfang, damit eine Station überhaupt Referenz wird
const BIAS_CAP        = 8;   // kn – Deckel gegen hängende Sensoren und Ausreißer
// Referenzstation: NUR Marenyet – dort wird gefoilt, dorthin muss die Zahl passen.
// Faro als Übergangslösung wurde verworfen: Die beiden Stationen verhalten sich
// nicht proportional zueinander. Am 10.09. maß der Faro um 15:30 Uhr 7,0 kn gegen
// 5,2 kn am Marenyet, um 16:50 Uhr aber nur noch 4,0 gegen 10,0 kn. Eine an Faro
// geeichte Korrektur hätte an diesem Nachmittag rund 4 kn angezeigt, während am
// Strand 10 kn standen – genau der Fehler vom 15.08., nur mit neuer Mechanik.
// Bis Marenyet genug Paare gesammelt hat (BIAS_MIN_TOTAL), zeigt die App den
// Rohwert wie bisher. Die Korrektur schaltet sich dann von selbst zu.
const BIAS_STATIONS = ["Cullera Marenyet"];

// Ensemble statt Einzelwert: ICON-EU-EPS rechnet denselben Tag 40-mal mit leicht
// gestörten Startbedingungen. Aus der Streuung der 40 Läufe wird eine
// Wahrscheinlichkeit — "70 % Chance auf 14 kn" ist für die Entscheidung, ob man
// hinfährt, ehrlicher als eine einzelne Zahl mit zwei Nachkommastellen.
// Gitterpunkt 2,1 km. Das ECMWF-Ensemble hätte 51 Mitglieder, sitzt aber auf
// 39,0/-0,25 und damit 15,8 km südlich – für diesen Spot unbrauchbar.
const ENSEMBLE_MODEL = "icon_eu";
const WING_MIN = 14;   // kn – Schwelle aus dem früheren Dashboard: ab hier lohnt Wing-Foilen

// Nowcast: AROME in 15-Minuten-Schritten, stündlich neu gerechnet, 6 Stunden
// voraus. Genau das Fenster zwischen "nachmittags entscheiden" und "am Strand
// stehen" — und der einzige Lauf hier, der schnell genug nachzieht, um die Brise
// beim Einsetzen zu erwischen.
// Die HD-Variante steht zuerst, liefert aber zeitweise gar nichts (am 10.09.2026
// auch über Frankreich leer). Deshalb dieselbe Logik wie beim Leitmodell: die
// erste Quelle mit Werten führt.
const NOWCAST_MODELS = [
  {id:"meteofrance_arome_france_hd_15min", name:"AROME HD", res:"1,5 km"},
  {id:"meteofrance_arome_france_15min",    name:"AROME",    res:"2,5 km"},
];

let lastLoaded = 0;

// ---------- Mathe-Helfer ----------
const mean = a => {
  const s = a.filter(v => v != null);
  return s.length ? s.reduce((x,y)=>x+y,0)/s.length : null;
};
const circMean = degs => {
  const s = degs.filter(v => v != null);
  if (!s.length) return null;
  let x=0, y=0;
  s.forEach(d => { const r = d*Math.PI/180; x += Math.cos(r); y += Math.sin(r); });
  return ((Math.atan2(y,x)*180/Math.PI)+360)%360;
};
const median = a => {
  if (!a.length) return null;
  const s = [...a].sort((x,y)=>x-y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
};
const dirName = d => {
  if (d == null) return "?";
  const n = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return n[Math.round(((d%360)+360)%360/22.5)%16];
};
// Pfeil zeigt dahin, wohin der Wind weht (meteorologisch: d = woher er kommt)
const dirArrow = d => d == null ? "" :
  `<span class="dir-arrow" style="transform:rotate(${(d+180)%360}deg)">&#8593;</span>`;

// Cullera-Strand schaut grob nach Osten:
// Wind AUS Ost (45–135°) = auflandig (drückt an Land, sicher fürs Wingen),
// Wind AUS West (225–315°) = ablandig (drückt aufs offene Meer – Vorsicht!)
function windQuality(d){
  if (d == null) return {label:"?", cls:"q-seit"};
  const deg = ((d%360)+360)%360;
  if (deg >= 45  && deg <= 135) return {label:"auflandig", cls:"q-auf"};
  if (deg >= 225 && deg <= 315) return {label:"ablandig",  cls:"q-ab"};
  return {label:"seitlich", cls:"q-seit"};
}

// ---------- Daten holen ----------
async function getJSON(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

// Bei mehreren Modellen suffixt Open-Meteo die Keys: wind_speed_10m_ecmwf_ifs025
function seriesFor(hourly, base, modelId, modelCount){
  if (modelCount === 1) return hourly[base] || null;
  return hourly[`${base}_${modelId}`] || null;
}

// ---------- Bias aus data/messreihe.csv ----------
// Spalten: zeit,station,gemessen_kn,grad,arome_kn
// Der Median statt des Mittels ist Absicht: eine einzelne hängende Böe oder ein
// Sensoraussetzer würde ein Mittel über acht Werte spürbar verziehen.
function buildBias(text){
  if (!text) return null;
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return null;

  const rows = [];
  for (let i = 1; i < lines.length; i++){
    const c = lines[i].split(",");
    if (c.length < 5) continue;
    const gemessen = parseFloat(c[2]), prognose = parseFloat(c[4]);
    if (!isFinite(gemessen) || !isFinite(prognose)) continue;
    rows.push({hour: +c[0].slice(11,13), station: c[1], diff: gemessen - prognose});
  }
  if (!rows.length) return null;

  const station = BIAS_STATIONS.find(
    n => rows.reduce((k,r) => k + (r.station === n ? 1 : 0), 0) >= BIAS_MIN_TOTAL);
  if (!station) return null;

  const mine = rows.filter(r => r.station === station);
  const cap = v => v == null ? null : Math.max(-BIAS_CAP, Math.min(BIAS_CAP, v));

  const byHour = {};
  mine.forEach(r => { (byHour[r.hour] = byHour[r.hour] || []).push(r.diff); });
  const perHour = {};
  Object.keys(byHour).forEach(h => {
    if (byHour[h].length >= BIAS_MIN_HOUR) perHour[h] = cap(median(byHour[h]));
  });

  // Stunden ohne eigene Stichprobe bekommen den Gesamtmedian – besser als gar
  // keine Korrektur, aber sichtbar gröber.
  const fallback = cap(median(mine.map(r => r.diff)));
  return {
    station, n: mine.length, perHour, fallback,
    delta: h => perHour[h] != null ? perHour[h] : fallback,
  };
}

async function fetchAll(){
  const windUrl = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${LAT}&longitude=${LON}`
    + "&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m"
    + "&wind_speed_unit=kn"
    + `&models=${WIND_MODELS.map(m=>m.id).join(",")}`
    + `&forecast_days=${FORECAST_DAYS}&timezone=${encodeURIComponent(TZ)}`;
  const waveUrl = "https://marine-api.open-meteo.com/v1/marine"
    + `?latitude=${LAT}&longitude=${LON}`
    + "&hourly=wave_height,wave_period,wave_direction"
    + `&models=${WAVE_MODELS.map(m=>m.id).join(",")}`
    + `&forecast_days=${FORECAST_DAYS}&timezone=${encodeURIComponent(TZ)}`;
  // Gemessene Werte aus dem eigenen Repo (ein GitHub-Actions-Job legt sie dort ab).
  // AVAMET direkt abzufragen geht nicht – die Seite schickt keine CORS-Header.
  // Fehlt die Datei oder ist sie kaputt, läuft die Prognose ohne sie weiter.
  const obs = getJSON("data/observations.json?t=" + Date.now()).catch(() => null);
  // Messreihe für die Bias-Korrektur. Fehlt sie oder ist sie noch zu kurz,
  // zeigt die App eben den Rohwert – nie ein Grund, den Ladevorgang abzubrechen.
  const reihe = fetch("data/messreihe.csv?t=" + Date.now())
    .then(r => r.ok ? r.text() : null).catch(() => null);

  // Ensemble, Nowcast und AEMET sind Zusatzquellen: Jede fällt für sich aus,
  // ohne die Prognose mitzureißen. Deshalb einzeln abgefangen statt im
  // Promise.all scheitern zu lassen.
  const ensUrl = "https://ensemble-api.open-meteo.com/v1/ensemble"
    + `?latitude=${LAT}&longitude=${LON}`
    + "&hourly=wind_speed_10m&wind_speed_unit=kn"
    + `&models=${ENSEMBLE_MODEL}`
    + `&forecast_days=${FORECAST_DAYS}&timezone=${encodeURIComponent(TZ)}`;
  const nowUrl = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${LAT}&longitude=${LON}`
    + "&minutely_15=wind_speed_10m,wind_gusts_10m,wind_direction_10m"
    + "&forecast_minutely_15=24&wind_speed_unit=kn"
    + `&models=${NOWCAST_MODELS.map(m=>m.id).join(",")}`
    + `&timezone=${encodeURIComponent(TZ)}`;

  const ens   = getJSON(ensUrl).catch(() => null);
  const now15 = getJSON(nowUrl).catch(() => null);
  // Liegt nur vor, wenn im Repo ein AEMET-Schlüssel hinterlegt ist.
  const aemet = getJSON("data/aemet.json?t=" + Date.now()).catch(() => null);

  const [wind, wave, live, csv, ensemble, nowcast, aemetData] = await Promise.all(
    [getJSON(windUrl), getJSON(waveUrl), obs, reihe, ens, now15, aemet]);
  return {
    wind, wave, live,
    bias: buildBias(csv),
    ensemble,
    nowcast: buildNowcast(nowcast),
    aemet: aemetData,
  };
}

// ---------- Nowcast aus den 15-Minuten-Schritten ----------
function buildNowcast(raw){
  if (!raw || !raw.minutely_15) return null;
  const m = raw.minutely_15, t = m.time || [];
  for (const src of NOWCAST_MODELS){
    const sp = m[`wind_speed_10m_${src.id}`];
    if (!sp) continue;
    const schritte = [];
    for (let i = 0; i < t.length; i++){
      if (sp[i] == null) continue;
      schritte.push({
        t: t[i],
        wind: sp[i],
        gust: (m[`wind_gusts_10m_${src.id}`]     || [])[i],
        dir:  (m[`wind_direction_10m_${src.id}`] || [])[i],
      });
    }
    if (schritte.length) return {name: src.name, res: src.res, schritte};
  }
  return null;
}

// ---------- Wahrscheinlichkeit aus dem Ensemble ----------
// Je Mitglied die Spitze im Fenster, daraus Streuung und Anteil über der
// Wing-Schwelle. Nicht der Mittelwert der Mitglieder: Ein Mittel über 40 Läufe
// glättet die Spitze genauso weg wie ein Modellmittel die Thermik.
function ensembleFor(ensemble, dateStr, h0, h1){
  if (!ensemble || !ensemble.hourly) return null;
  const h = ensemble.hourly, t = h.time || [];
  const mitglieder = Object.keys(h).filter(k => k.startsWith("wind_speed_10m"));
  if (!mitglieder.length) return null;

  const idx = [];
  for (let i = 0; i < t.length; i++){
    if (t[i].slice(0,10) !== dateStr) continue;
    const st = +t[i].slice(11,13);
    if (st >= h0 && st <= h1) idx.push(i);
  }
  if (!idx.length) return null;

  const spitzen = [];
  for (const k of mitglieder){
    let best = null;
    for (const i of idx){
      const v = h[k][i];
      if (v != null && (best == null || v > best)) best = v;
    }
    if (best != null) spitzen.push(best);
  }
  if (spitzen.length < 5) return null;

  spitzen.sort((a,b) => a-b);
  const q = p => spitzen[Math.min(Math.floor(p * spitzen.length), spitzen.length-1)];
  return {
    n: spitzen.length,
    p10: q(0.1),
    median: median(spitzen),
    p90: q(0.9),
    chance: Math.round(100 * spitzen.filter(v => v >= WING_MIN).length / spitzen.length),
  };
}

// ---------- AEMET als zweite Meinung ----------
function aemetFor(aemet, dateStr, h0, h1){
  if (!aemet || !Array.isArray(aemet.stunden)) return null;
  const treffer = aemet.stunden.filter(s => {
    if (s.zeit.slice(0,10) !== dateStr) return false;
    const st = +s.zeit.slice(11,13);
    return st >= h0 && st <= h1;
  });
  if (!treffer.length) return null;
  const peak = Math.max(...treffer.map(s => s.kn));
  const beste = treffer.find(s => s.kn === peak);
  // grad, nicht das Kürzel: AEMET liefert spanische Rosenkürzel, in denen O für
  // Westen steht. Die Umrechnung passiert im Abrufskript, hier kommt schon Grad an.
  return {peak, stunde: +beste.zeit.slice(11,13), grad: beste.grad, n: treffer.length};
}

// ---------- Aggregation ----------
function windowIdx(times, dateStr, h0, h1){
  const idx = [];
  for (let i=0;i<times.length;i++){
    if (times[i].slice(0,10) !== dateStr) continue;
    const h = +times[i].slice(11,13);
    if (h >= h0 && h <= h1) idx.push(i);
  }
  return idx;
}

function aggregate({wind, wave, bias, ensemble, aemet}){
  const wTimes = wind.hourly.time;
  const vTimes = wave.hourly.time;

  // Tagesliste aus den Wind-Zeitstempeln
  const dates = [...new Set(wTimes.map(t=>t.slice(0,10)))].sort().slice(0, FORECAST_DAYS);

  return dates.map(d => {
    // Ø-Werte über das relevante Session-Fenster (Mo–Fr 15–21, Sa/So ganztags)
    const [s0, s1] = sessionWindow(d);
    const wi = windowIdx(wTimes, d, s0, s1);
    const vi = windowIdx(vTimes, d, s0, s1);

    // Wind pro Quelle: Spitze, Ø und Böen-Max im Fenster.
    // Die Spitze ist die entscheidende Zahl – ein Fenstermittel über 8–21 Uhr
    // verrechnet die tote Vormittagsflaute mit der Nachmittagsthermik und
    // lässt einen brauchbaren Tag nach Flaute aussehen.
    const perSource = WIND_MODELS.map(m => {
      const sp = seriesFor(wind.hourly, "wind_speed_10m", m.id, WIND_MODELS.length);
      const gu = seriesFor(wind.hourly, "wind_gusts_10m", m.id, WIND_MODELS.length);
      const dr = seriesFor(wind.hourly, "wind_direction_10m", m.id, WIND_MODELS.length);
      if (!sp) return null;
      const speeds = wi.map(i=>sp[i]).filter(v=>v!=null);
      if (!speeds.length) return null;
      const gusts = gu ? wi.map(i=>gu[i]).filter(v=>v!=null) : [];
      const peak = Math.max(...speeds);
      const peakI = wi.find(i => sp[i] === peak);
      return {
        name: m.name, res: m.res, id: m.id,
        // AROME endet nach ~69 h mitten im Tag. Ein Modell, das das Fenster nur
        // halb abdeckt, darf nicht führen – sonst wäre die "Spitze" auf einem
        // abgeschnittenen Fenster berechnet und könnte die echte verfehlen.
        complete: speeds.length === wi.length,
        peak,
        peakHour: peakI != null ? +wTimes[peakI].slice(11,13) : null,
        peakDir: (dr && peakI != null) ? dr[peakI] : null,
        avg: mean(wi.map(i=>sp[i])),
        gustMax: gusts.length ? Math.max(...gusts) : null,
      };
    }).filter(Boolean);

    // Leitmodell = feinste Auflösung, die das Fenster lückenlos abdeckt
    const lead = perSource.find(s => s.complete) || perSource[0] || null;

    const leadSp = lead ? seriesFor(wind.hourly, "wind_speed_10m",     lead.id, WIND_MODELS.length) : null;
    const leadGu = lead ? seriesFor(wind.hourly, "wind_gusts_10m",     lead.id, WIND_MODELS.length) : null;
    const leadDr = lead ? seriesFor(wind.hourly, "wind_direction_10m", lead.id, WIND_MODELS.length) : null;

    // Bias-Korrektur greift nur beim Modell, gegen das gemessen wurde. Eine an
    // AROME HD bestimmte Abweichung sagt nichts über ECMWF oder ICON-EU – sie
    // dort anzuwenden wäre geraten, nicht gemessen.
    const corr = (bias && lead && lead.id === BIAS_MODEL_ID) ? bias : null;
    const adj = (v, h) => (corr && v != null) ? Math.max(0, v + corr.delta(h)) : v;

    // Die Spitze wird nach der Korrektur neu gesucht, nicht nachträglich
    // verschoben: Weil der Bias über den Tag wandert, kann die Spitzenstunde
    // eine andere sein als im Rohlauf.
    let peak = lead ? lead.peak : null;
    let peakHour = lead ? lead.peakHour : null;
    let peakDir = lead ? lead.peakDir : null;
    let windAvg = lead ? lead.avg : null;
    let gustMax = lead ? lead.gustMax : null;
    const peakRaw = lead ? lead.peak : null;
    if (corr && leadGu){
      const g = wi.map(i => adj(leadGu[i], +wTimes[i].slice(11,13))).filter(v => v != null);
      if (g.length) gustMax = Math.max(...g);
    }
    if (corr && leadSp){
      const vals = wi
        .map(i => ({i, h: +wTimes[i].slice(11,13), v: adj(leadSp[i], +wTimes[i].slice(11,13))}))
        .filter(x => x.v != null);
      if (vals.length){
        const best = vals.reduce((a,b) => b.v > a.v ? b : a);
        peak = best.v;
        peakHour = best.h;
        peakDir = leadDr ? leadDr[best.i] : null;
        windAvg = mean(vals.map(x => x.v));
      }
    }

    // Welle pro Quelle: Ø Höhe/Periode im Fenster
    const waveSources = WAVE_MODELS.map(m => {
      const wh = seriesFor(wave.hourly, "wave_height", m.id, WAVE_MODELS.length);
      const wp = seriesFor(wave.hourly, "wave_period", m.id, WAVE_MODELS.length);
      const dr = seriesFor(wave.hourly, "wave_direction", m.id, WAVE_MODELS.length);
      if (!wh) return null;
      const h = mean(vi.map(i=>wh[i]));
      if (h == null) return null;
      return {
        name: m.name, res: m.res, id: m.id,
        complete: vi.every(i => wh[i] != null),
        h,
        p: wp ? mean(vi.map(i=>wp[i])) : null,
        dir: dr ? circMean(vi.map(i=>dr[i])) : null,
      };
    }).filter(Boolean);

    const waveLead = waveSources.find(s => s.complete) || waveSources[0] || null;

    // Stundenleiste 8–21 Uhr: Werte des Leitmodells (nicht gemittelt),
    // Session-Fenster-Stunden werden markiert (hl)
    const leadWh  = waveLead ? seriesFor(wave.hourly, "wave_height", waveLead.id, WAVE_MODELS.length) : null;

    const stripIdx = windowIdx(wTimes, d, STRIP_START, STRIP_END);
    const hours = stripIdx.map(i => {
      const t = wTimes[i];
      const h = +t.slice(11,13);
      const vIdx = vTimes.indexOf(t);
      // hl nur, wenn das Fenster enger als die Leiste ist (Mo–Fr)
      const hl = s0 > STRIP_START && h >= s0 && h <= s1;
      // Die Böe wird um denselben Betrag mitverschoben. Gemessen wurde nur der
      // mittlere Wind, deshalb bleibt der Böenaufschlag des Modells (Böe minus
      // Wind) unangetastet und nur das Grundniveau wandert – die schwächere der
      // beiden möglichen Annahmen. Ohne das stünde in der Leiste "Wind 1 kn,
      // Böen 14 kn" nebeneinander.
      const wCorr = leadSp ? adj(leadSp[i], h) : null;
      const gCorr = (leadGu && leadGu[i] != null)
        ? Math.max(wCorr != null ? wCorr : 0, adj(leadGu[i], h))
        : null;
      return {
        t, hl,
        wind: wCorr,
        gust: gCorr,
        dir:  leadDr ? leadDr[i] : null,
        wave: (leadWh && vIdx >= 0) ? leadWh[vIdx] : null,
      };
    });

    // Streuung über alle Modelle: wie einig sich die Quellen über die Spitze sind
    const peaks = perSource.map(s=>s.peak);

    return {
      date: d,
      winStart: s0, winEnd: s1,
      leadName: lead ? lead.name : null,
      leadRes:  lead ? lead.res  : null,
      windPeak: peak,
      peakHour,
      windAvg,
      gustMax,
      windDir:  peakDir,
      // Korrektur-Herkunft, damit die Karte offenlegt, woher die Zahl kommt
      peakRaw:      corr ? peakRaw : null,
      biasDelta:    (corr && peakHour != null) ? corr.delta(peakHour) : null,
      biasStation:  corr ? corr.station : null,
      biasN:        corr ? corr.n : null,
      spreadMin: peaks.length ? Math.min(...peaks) : null,
      spreadMax: peaks.length ? Math.max(...peaks) : null,
      perSource,
      ens:   ensembleFor(ensemble, d, s0, s1),
      aemet: aemetFor(aemet, d, s0, s1),
      waveH:    waveLead ? waveLead.h : null,
      waveP:    waveLead ? waveLead.p : null,
      waveDir:  waveLead ? waveLead.dir : null,
      waveLeadName: waveLead ? waveLead.name : null,
      waveSourceCount: waveSources.length,
      hours,
    };
  });
}

// ---------- Rendering ----------
function dayLabel(dateStr, idx){
  if (idx === 0) return "Heute";
  if (idx === 1) return "Morgen";
  return new Date(dateStr+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long"});
}

// Gemessene Werte über den Prognosekarten. Bewusst getrennt dargestellt:
// gemessen ist etwas anderes als gerechnet.
function renderLive(live){
  if (!live || !Array.isArray(live.stationen) || !live.stationen.length) return "";
  const rows = live.stationen.map(s => {
    const q = windQuality(s.grad);
    const zeit = (s.gemessen || "").slice(11,16);
    return `<div class="live-row${s.veraltet ? " alt" : ""}">`
      + `<span class="st">${s.name}</span>`
      + `<span class="meta">${dirArrow(s.grad)} ${s.richtung || "?"} `
      + `<span class="${q.cls}">${q.label}</span> · ${zeit}</span>`
      + `<span class="kn">${s.kn} <small>kn</small></span></div>`;
  }).join("");
  return `<div class="live">`
    + `<div class="lab"><span>Jetzt gemessen</span><span class="src">${live.quelle || ""}</span></div>`
    + rows + `</div>`;
}

// Nowcast-Leiste zwischen Messung und Prognose: was in den nächsten Stunden
// passiert, bevor die Tageskarten den groben Verlauf zeigen.
function renderNowcast(nc){
  if (!nc || !nc.schritte.length) return "";
  const jetzt = Date.now();
  // Nur was noch kommt, plus den letzten vergangenen Schritt als Anschluss.
  let ab = nc.schritte.findIndex(s => new Date(s.t).getTime() >= jetzt);
  if (ab < 0) return "";
  ab = Math.max(0, ab - 1);
  const zeigen = nc.schritte.slice(ab, ab + 20);
  if (!zeigen.length) return "";

  // Gleiche transponierte Tabelle wie die Stundenleiste der Tageskarten –
  // eine zweite Darstellungsform für dieselbe Sache wäre nur Lernaufwand.
  const spitze = Math.max(...zeigen.map(s => s.wind));
  const hl = s => s.wind === spitze ? ' class="hl"' : "";
  const zeilen = [
    ["Uhr",    zeigen.map(s => `<th${hl(s)}>${s.t.slice(11,16)}</th>`).join("")],
    ["Wind",   zeigen.map(s => `<td${hl(s)}><b>${Math.round(s.wind)}</b></td>`).join("")],
    ["Böen",   zeigen.map(s => `<td${hl(s)}>${s.gust == null ? "–" : Math.round(s.gust)}</td>`).join("")],
    ["Richt.", zeigen.map(s => `<td${hl(s)}><span class="${windQuality(s.dir).cls}">${dirName(s.dir)}</span></td>`).join("")],
  ].map(([lab, cells]) => `<tr><th class="rowlab">${lab}</th>${cells}</tr>`).join("");

  return `<div class="nowcast">`
    + `<div class="lab"><span>Nächste Stunden · 15-Min-Schritte</span>`
    + `<span class="src">${nc.name} ${nc.res}</span></div>`
    + `<div class="strip"><table class="hours">${zeilen}</table></div></div>`;
}

function render(days, live, nowcast){
  const fmt1 = v => v==null ? "–" : v.toFixed(1);
  const fmt0 = v => v==null ? "–" : Math.round(v).toString();
  const fmtSigned = v => v==null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(1);

  let html = renderLive(live) + renderNowcast(nowcast) + '<div class="cards">';
  days.forEach((d, idx) => {
    const dateStr = new Date(d.date+"T12:00:00")
      .toLocaleDateString("de-DE",{day:"2-digit",month:"long"});
    const srcRows = d.perSource.map(s => {
      const isLead = s.name === d.leadName;
      return `<div class="srow${isLead ? " srow-lead" : ""}">`
        + `<span>${s.name} <span class="res">${s.res}</span>`
        + `${isLead ? ' <span class="lead-tag">Leitmodell</span>' : ""}`
        + `${!s.complete ? ' <span class="res">unvollständig</span>' : ""}</span>`
        + `<span class="sv">${fmt0(s.peak)} kn</span></div>`;
    }).join("")
    // AEMET steht abgesetzt darunter: Es ist keine weitere Rechnung derselben
    // Art, sondern Spaniens eigener Lauf, redaktionell geprüft. In die
    // Streuungsangabe darf es deshalb nicht einfließen.
    + (d.aemet ? `<div class="srow srow-aemet">`
        + `<span>AEMET <span class="res">2,5 km</span> <span class="zweit-tag">zweite Meinung</span>`
        + (d.aemet.grad == null ? "" :
            ` <span class="res">${dirName(d.aemet.grad)} <span class="${windQuality(d.aemet.grad).cls}">${windQuality(d.aemet.grad).label}</span></span>`)
        + `</span>`
        + `<span class="sv">${fmt0(d.aemet.peak)} kn</span></div>` : "");

    // Große Streuung = die Modelle sind sich uneinig, Prognose unsicher
    const spread = (d.spreadMax != null && d.spreadMin != null) ? d.spreadMax - d.spreadMin : null;
    const spreadWarn = spread != null && spread >= 6;

    // Stundenleiste: transponierte Tabelle (Stunden = Spalten), Fenster markiert
    const hlc = h => h.hl ? ' class="hl"' : "";
    const stripRows = [
      ["Uhr",   d.hours.map(h=>`<th${hlc(h)}>${h.t.slice(11,13)}</th>`).join("")],
      ["Wind",  d.hours.map(h=>`<td${hlc(h)}><b>${fmt0(h.wind)}</b></td>`).join("")],
      ["Böen",  d.hours.map(h=>`<td${hlc(h)}>${fmt0(h.gust)}</td>`).join("")],
      ["Richt.",d.hours.map(h=>`<td${hlc(h)}><span class="${windQuality(h.dir).cls}" title="${windQuality(h.dir).label}">${dirName(h.dir)}</span></td>`).join("")],
      ["Welle", d.hours.map(h=>`<td${hlc(h)}>${fmt1(h.wave)}</td>`).join("")],
    ].map(([lab, cells]) => `<tr><th class="rowlab">${lab}</th>${cells}</tr>`).join("");

    html += `
    <div class="card">
      <div class="card-head">
        <span class="day">${dayLabel(d.date, idx)}</span>
        <span class="date">${dateStr} · ${d.winStart}–${d.winEnd} Uhr</span>
      </div>
      <div class="big">
        <div class="stat">
          <div class="lab">Wind Spitze</div>
          <div class="val">${fmt0(d.windPeak)} <small>kn</small>${
            d.peakHour != null ? ` <small class="at">um ${String(d.peakHour).padStart(2,"0")} Uhr</small>` : ""}</div>
          <div class="sub">${dirArrow(d.windDir)} aus <b>${dirName(d.windDir)}</b> · <span class="${windQuality(d.windDir).cls}">${windQuality(d.windDir).label}</span></div>
          <div class="sub">Böen <b>${fmt0(d.gustMax)} kn</b> · Ø Fenster ${fmt0(d.windAvg)} kn</div>
          ${d.ens ? `<div class="chance">
            <div class="chance-head"><span>Chance auf ${WING_MIN} kn</span><b>${d.ens.chance} %</b></div>
            <div class="chance-bar"><i style="width:${Math.max(2, d.ens.chance)}%"></i></div>
            <div class="chance-sub">${fmt0(d.ens.p10)}–${fmt0(d.ens.p90)} kn in 80 % der Läufe<br>${d.ens.n} × ICON-EU-EPS · 13 km</div>
          </div>` : ""}
          ${d.biasDelta != null ? `<div class="sub bias">korrigiert ${fmtSigned(d.biasDelta)} kn · Modell roh ${fmt0(d.peakRaw)} kn<br>aus ${d.biasN} Messungen · ${d.biasStation}</div>` : ""}
          <div class="sub spread${spreadWarn ? " spread-warn" : ""}">Modelle ${d.biasDelta != null ? "roh " : ""}${fmt0(d.spreadMin)}–${fmt0(d.spreadMax)} kn${
            spreadWarn ? " · unsicher" : ""}</div>
        </div>
        <div class="stat">
          <div class="lab">Welle Ø</div>
          <div class="val">${fmt1(d.waveH)} <small>m</small></div>
          <div class="sub">Periode <b>${fmt0(d.waveP)} s</b></div>
          <div class="sub">aus <b>${dirName(d.waveDir)}</b></div>
          <div class="sub spread">${d.waveLeadName || "–"}</div>
        </div>
      </div>
      <div class="strip-wrap">
        <div class="lab">Stundenverlauf${d.hours.some(h=>h.hl)
          ? ` <span class="hl-hint">■ ${d.winStart}–${d.winEnd} Uhr</span>` : ""}</div>
        <div class="strip"><table class="hours">${stripRows}</table></div>
      </div>
      <div class="sources">
        <div class="lab">Spitze je Quelle · roh, unkorrigiert</div>
        ${srcRows}
      </div>
    </div>`;
  });
  html += "</div>";
  document.getElementById("content").innerHTML = html;

  // Unter der Woche direkt zum relevanten Fenster scrollen.
  // Nur die Leisten der Tageskarten: In der Nowcast-Leiste markiert .hl die
  // Spitze, nicht das Fenster – dorthin zu scrollen würde ausgerechnet die
  // nächsten Viertelstunden aus dem Bild schieben.
  document.querySelectorAll(".strip-wrap .strip").forEach(el => {
    const hl = el.querySelector(".hl");
    if (hl) el.scrollLeft = Math.max(0, hl.offsetLeft - 52);
  });
}

async function load(){
  document.getElementById("content").innerHTML =
    '<div class="state"><div class="spinner"></div>Lade Vorhersage&hellip;</div>';
  try{
    const data = await fetchAll();
    const days = aggregate(data);
    render(days, data.live, data.nowcast);
    lastLoaded = Date.now();
    document.getElementById("updated").textContent =
      "Stand: " + new Date().toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    const lead = days[0] ? days[0].leadName : "–";
    const leadRes = days[0] ? days[0].leadRes : "";
    const nWind = days[0] ? days[0].perSource.length : 0;
    const bias = days.find(d => d.biasDelta != null);
    document.getElementById("foot").textContent =
      (bias
        ? `Die große Zahl ist am Standort nachkalibriert: Aus ${bias.biasN} eigenen Messpaaren `
          + `(${bias.biasStation}) wird je Tagesstunde bestimmt, wie weit AROME HD danebenliegt, `
          + `und der Modellwert entsprechend verschoben. Die Auswertung im September 2026 ergab: `
          + `nachmittags rechnet das Modell 3–5 kn ZU HOCH, nicht zu niedrig. Die Böe wandert um `
          + `denselben Betrag mit, ihr Aufschlag über den Wind bleibt also der des Modells. `
          + `Korrigiert wird nur, solange AROME HD führt: Die Abweichung wurde gegen dieses eine `
          + `Modell gemessen und sagt nichts über ECMWF oder ICON-EU. Deshalb steht in der `
          + `Quellenliste weiter der Rohwert. Die Korrektur wird von allein besser, je länger der `
          + `Job mitschreibt. `
        : "")
      + `Die Chance-Angabe kommt aus einem ANDEREN Modell als die große Zahl: ICON-EU-EPS rechnet `
      + `denselben Tag 40-mal durch, aber nur in 13 km Gitterweite. Deshalb kann die Spitze über `
      + `der Schwelle liegen, während die Chance niedrig ist – das feine Modell sieht die Küstenbrise, `
      + `das grobe verschmiert sie. Die Prozentzahl taugt für "wie sicher ist das", nicht als zweite `
      + `Meinung zur Höhe. Als solche steht AEMET in der Quellenliste. `
      + `Alle übrigen Zahlen stammen vom Leitmodell (heute ${lead}, ${leadRes}) – nicht gemittelt. `
      + `Die ${nWind} Quellen werden nur zur Streuung ausgewiesen: liegen sie weit auseinander, ist die Prognose unsicher. `
      + `Spitze = höchster Stundenwert im Fenster (Mo–Fr ${SESSION_WEEKDAY[0]}–${SESSION_WEEKDAY[1]} Uhr, `
      + `Sa/So ${SESSION_WEEKEND[0]}–${SESSION_WEEKEND[1]} Uhr), weil ein Tagesmittel die Nachmittagsthermik wegrechnet. `
      + `Fensterende ${SESSION_WEEKDAY[1]} Uhr: danach ist Sonnenuntergang – und AROME reicht am dritten Tag genau bis dahin. `
      + "Grün = auflandig (Wind vom Meer, drückt an Land). "
      + "Rot = ablandig (drückt aufs offene Meer – Vorsicht!). "
      + "Prognose: Open-Meteo (CC-BY 4.0). Messwerte: AVAMET (CC BY-NC-ND 4.0), "
      + "Stationen Cullera Marenyet, Faro und San Antonio, alle 30 Minuten abgeholt. "
      + "Auch 1,5 km bleibt ein Modell – kein Ersatz für den Blick aufs Meer.";
  }catch(e){
    document.getElementById("content").innerHTML =
      `<div class="state">Vorhersage konnte nicht geladen werden.<br>(${e.message})<br><br>Internetverbindung prüfen und oben aktualisieren.</div>`;
  }
}

document.getElementById("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastLoaded > STALE_MS) load();
});
load();

// ---------- Service Worker ----------
// Registriert die App-Shell fuer Offline-Start und Installierbarkeit.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW-Registrierung fehlgeschlagen:", err));
}
</script>
</body>
</html>
